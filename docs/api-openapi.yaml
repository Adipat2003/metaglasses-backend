openapi: 3.0.3
info:
  title: MetaGlasses AWS API
  version: 1.0.0
  description: |
    AWS backend HTTP endpoints. Phone operations require an accepted Cognito access token;
    display uses a pairing capability. Model outputs are not guaranteed identical across calls.
    Stored revisions and idempotent retries return persisted results. Include x-request-id when
    reporting application failures. API Gateway and network failures may have another format.
servers:
  - url: https://xay03orwv0.execute-api.us-east-1.amazonaws.com
    description: Documented AWS endpoint; verify the environment before use.
security:
  - cognitoAccessToken: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API process health
      security: []
      responses:
        '200':
          description: Process responds; dependencies are not checked.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [status, environment, auth]
                properties:
                  status: { type: string, enum: [ok] }
                  environment: { type: string, enum: [aws, local] }
                  auth: { type: string, enum: [required] }
        '500': { $ref: '#/components/responses/Error' }
  /v1/state:
    post:
      operationId: setPairingState
      summary: Register or refresh a pairing and set phone state
      description: |
        Requires a Cognito access token and a 32-character pairing token registered to the caller.
        Registering or refreshing the pairing renews its one-hour lifetime. Call this while the
        phone session is active; display polling does not renew the pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingToken, state]
              properties:
                pairingToken: { $ref: '#/components/schemas/PairingToken' }
                state: { type: string, enum: [idle, listening, thinking, speaking] }
      responses:
        '204': { description: Pairing state saved., headers: { x-request-id: { $ref: '#/components/headers/RequestId' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/display:
    get:
      operationId: getDisplay
      summary: Read the current lens display
      description: |
        Requires a current pairing token as the `token` query parameter. No Cognito token is
        required. The pairing token is a capability credential: never log or share it. Polling
        does not renew the pairing; `responseId` changes when a new message is published.
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { $ref: '#/components/schemas/PairingToken' } }
      responses:
        '200':
          description: Latest display state; response fields may be null before the first message.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [responseId, text, state, createdAt]
                properties:
                  responseId: { type: string, nullable: true }
                  text: { type: string, nullable: true }
                  state: { type: string, enum: [idle, listening, thinking, speaking] }
                  createdAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/chat:
    post:
      operationId: createChatResponse
      summary: Generate a Talk response or publish paired chat
      description: |
        Send a Cognito access token and the relevant local transcript, up to 256000 UTF-8 bytes.
        Phone requests use clientRequestId and may include a run and its current state version.
        An optional observation must be observed for that run and state version. Phone requests
        accept owner-scoped images on user messages. Retry the identical phone request with its
        original ID. The legacy pairingToken shape uses pairing images, publishes to the lens,
        and does not support idempotent retries. Provider credentials are used for the call only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/ChatTranscript'
                    - type: object
                      required: [pairingToken]
                      properties:
                        pairingToken: { $ref: '#/components/schemas/PairingToken' }
                - allOf:
                    - $ref: '#/components/schemas/ChatTranscript'
                    - type: object
                      required: [clientRequestId]
                      properties:
                        clientRequestId: { type: string, format: uuid }
                        taskRunId: { type: string, format: uuid, description: Requires expectedStateVersion. }
                        expectedStateVersion: { type: integer, minimum: 1, maximum: 9000000000000000, description: Requires taskRunId. }
                        observationWindowId: { type: string, format: uuid, description: Requires taskRunId and expectedStateVersion. }
      responses:
        '200':
          description: Generated response, also published to the lens for legacy paired chat.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [responseId, text, createdAt]
                properties:
                  responseId: { type: string }
                  text: { type: string }
                  createdAt: { type: string, format: date-time }
                  taskRunId: { type: string, format: uuid, description: Present for a run-context reply. }
                  stateVersion: { type: integer, minimum: 1, description: Present for a run-context reply. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/images:
    post:
      operationId: uploadPairingImage
      summary: Upload raw JPEG or PNG image bytes
      description: |
        Requires a Cognito access token. Supply taskRunId for an active run owned by the caller,
        pairingToken for a legacy active pairing, or omit both for owner-scoped Talk images.
        Send a nonempty raw JPEG or PNG with a matching Content-Type. The cap is 2 MiB for run
        images and 8 MiB for Talk and pairing images. Reuse clientImageId for the same bytes and scope.
      parameters:
        - $ref: '#/components/parameters/ImagePairingToken'
        - $ref: '#/components/parameters/ImageTaskRunId'
        - { name: clientImageId, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Uploaded image, up to 8 MiB. Inference windows have a 2 MiB per-frame limit.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [imageId, contentType, byteSize, createdAt]
                properties:
                  imageId: { type: string, format: uuid }
                  contentType: { type: string, enum: [image/jpeg, image/png] }
                  byteSize: { type: integer, minimum: 1, maximum: 8388608 }
                  createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/images/{imageId}:
    delete:
      operationId: deletePairingImage
      summary: Delete one image from its upload scope
      description: Requires a Cognito access token and the same scope used at upload. Omit both scope parameters for a Talk image.
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ImagePairingToken'
        - $ref: '#/components/parameters/ImageTaskRunId'
      responses:
        '204': { description: Image deleted., headers: { x-request-id: { $ref: '#/components/headers/RequestId' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-plans:
    get:
      operationId: listTaskPlans
      summary: List shared approved plans and the signed-in user's own plans
      description: |
        Requires a Cognito access token. No device pairing is needed. Returns all approved plans
        and the caller's unexpired private plans, never another user's unapproved plans.
        Unapproved plans expire two hours after creation; approved plans do not expire.
        Sort order is createdAt descending, then taskPlanId descending. Offset pagination can
        shift when plans are created or approved between requests; refresh from offset zero.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, awaiting_approval, approved, abandoned] }, description: Omit to include shared approved plans and all caller-owned plans. }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 2147483547, default: 0 } }
      responses:
        '200':
          description: Page of visible plan summaries; nextOffset is null on the last page.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPlanPage' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskPlan
      summary: Create an initial plan proposal from a goal or user steps
      description: |
        Supply a short goal for a model-generated draft or provide a title and the original steps.
        The plan stays in draft and requires explicit user approval before a run. Reuse the same
        clientRequestId and identical request when retrying. A changed request with the same ID
        returns 409. Unapproved plans expire two hours after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [goal, clientRequestId]
                  additionalProperties: false
                  properties:
                    goal: { type: string, minLength: 1, maxLength: 2000 }
                    clientRequestId: { type: string, format: uuid }
                - type: object
                  required: [clientRequestId, title, steps]
                  properties:
                    pairingToken: { type: string, pattern: '^[0-9a-fA-F]{32}$', description: Legacy optional field. If supplied, it must be an active pairing owned by the caller. Omit for new clients. }
                    clientRequestId: { type: string, format: uuid }
                    title: { type: string, minLength: 1, maxLength: 160 }
                    steps:
                      type: array
                      minItems: 1
                      maxItems: 30
                      description: Combined normalized instruction length must not exceed 16000 characters.
                      items:
                        type: object
                        required: [instruction]
                        properties:
                          instruction: { type: string, minLength: 1, maxLength: 1000 }
            example:
              clientRequestId: 11111111-1111-4111-8111-111111111111
              title: Make tea
              steps:
                - instruction: Pour the hot water into the cup.
      responses:
        '201': { $ref: '#/components/responses/CreatedPlan' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-plans/{taskPlanId}:
    parameters: [{ $ref: '#/components/parameters/TaskPlanId' }]
    get:
      operationId: getTaskPlan
      summary: Read the current plan version and review
      description: Requires a Cognito access token. The caller can read their own plan or any approved plan. Revision history is returned only to the owner.
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-plans/{taskPlanId}/refine:
    parameters: [{ $ref: '#/components/parameters/TaskPlanId' }]
    post:
      operationId: refineTaskPlan
      summary: Propose a revised plan version
      description: |
        Requires a Cognito access token and a draft plan owned by the caller. Use the current
        version and a new request ID for a new edit. Reuse both the ID and identical message for
        retries. Refinement invalidates the previous review. Initial creation uses one revision,
        leaving at most nine subsequent revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientRequestId, expectedVersion, message]
              properties:
                clientRequestId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 1 }
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-plans/{taskPlanId}/validate:
    parameters: [{ $ref: '#/components/parameters/TaskPlanId' }]
    post:
      operationId: validateTaskPlan
      summary: Review the current draft without approving it
      description: Requires a Cognito access token and a draft plan owned by the caller. A review is saved only if the reviewed version is still current. This can call the configured plan review model.
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-plans/{taskPlanId}/approve:
    parameters: [{ $ref: '#/components/parameters/TaskPlanId' }]
    post:
      operationId: approveTaskPlan
      summary: Review and approve the current version after explicit user consent
      description: |
        Requires a Cognito access token, a draft plan owned by the caller, and explicit user
        consent to publish the plan to all signed-in users. Runs a strict review and approves only
        if all checks pass and the plan is unchanged. On task_plan_guidelines_failed, retrieve
        the plan to display saved blockers and questions.
        New clients send the exact reviewed version with a stable clientRequestId.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, clientRequestId]
              properties:
                expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
                clientRequestId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs:
    get:
      operationId: listUnfinishedTaskRuns
      summary: List the caller's active and paused runs
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [unfinished] } }
      responses:
        '200':
          description: Unfinished runs owned by the caller, active first.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskRun' } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: startTaskRun
      summary: Start an approved plan for the caller
      description: |
        Requires a Cognito access token and an approved, validated plan. Phone clients provide
        expectedPlanVersion and omit pairingToken. Legacy clients can provide an owned, active
        pairing; requests omitting both fields use the plan's original pairing when available.
        The caller can have one active run. To switch, supply its ID and state version in activeRun
        so it is paused in the same transaction. Reuse the same clientRequestId and payload for retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskPlanId, clientRequestId]
              properties:
                taskPlanId: { type: string, format: uuid }
                clientRequestId: { type: string, format: uuid }
                pairingToken: { $ref: '#/components/schemas/PairingToken' }
                expectedPlanVersion: { type: integer, minimum: 1, maximum: 2147483647 }
                activeRun: { $ref: '#/components/schemas/ActiveRun' }
      responses:
        '201': { $ref: '#/components/responses/Run' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs/{taskRunId}:
    parameters: [{ $ref: '#/components/parameters/TaskRunId' }]
    get:
      operationId: getTaskRun
      summary: Read the current task-run state
      description: Requires a Cognito access token and a task run owned by the caller.
      responses:
        '200': { $ref: '#/components/responses/Run' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs/{taskRunId}/commands:
    parameters: [{ $ref: '#/components/parameters/TaskRunId' }]
    post:
      operationId: commandTaskRun
      summary: Apply an explicit user command
      description: |
        Requires a Cognito access token and an active or paused run owned by the caller. Use the
        latest stateVersion as expectedStateVersion. A command's validity depends on the current
        run state; on a stale or invalid transition response, fetch the run before deciding again.
        Reuse the same clientRequestId and identical command payload when retrying an uncertain
        result. Resume can include activeRun to pause a different active run atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RunRequest'
                - type: object
                  required: [command]
                  properties:
                    command: { type: string, enum: [pause, resume, repeat, confirm, skip, back, correct, stop] }
                    activeRun: { $ref: '#/components/schemas/ActiveRun' }
      responses:
        '200': { $ref: '#/components/responses/RunCommand' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs/{taskRunId}/stop:
    parameters: [{ $ref: '#/components/parameters/TaskRunId' }]
    post:
      operationId: stopTaskRun
      summary: Stop a task run
      description: Requires a Cognito access token and an active or paused run owned by the caller. Supply its latest stateVersion and reuse the request ID if retrying an uncertain result.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RunRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/RunCommand' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs/{taskRunId}/inference-windows:
    parameters: [{ $ref: '#/components/parameters/TaskRunId' }]
    post:
      operationId: submitInferenceWindow
      summary: Queue one to three previously uploaded frames
      description: |
        Requires an active run owned by the caller and one to three unique run-scoped frames,
        each up to 2 MiB. Paired runs also accept legacy images from the run's active pairing.
        Capture times must be strictly increasing canonical UTC timestamps with milliseconds.
        A new request accepts captures from 30 seconds before to 5 seconds after server time.
        Replay the original request ID and payload after an uncertain submission, even after
        the freshness window has passed. Phone runs accept one queued or processing window
        at a time. An optional question is answered in the same observation. Poll the
        returned window ID for its status. Observations never advance the run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientRequestId, expectedStateVersion, sequenceNumber, frames]
              properties:
                clientRequestId: { type: string, format: uuid }
                expectedStateVersion: { type: integer, minimum: 1, maximum: 9000000000000000 }
                sequenceNumber: { type: integer, minimum: 1, maximum: 9000000000000000 }
                question: { type: string, minLength: 1, maxLength: 500 }
                frames:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [imageId, capturedAt]
                    properties:
                      imageId: { type: string, format: uuid }
                      capturedAt: { type: string, format: date-time, example: '2026-01-01T00:00:00.000Z' }
      responses:
        '202':
          description: Window accepted, possibly already processed on an idempotent retry.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [outcome, inferenceWindowId, sequenceNumber, status, stateVersion, createdAt]
                properties:
                  outcome: { type: string, enum: [accepted] }
                  inferenceWindowId: { type: string, format: uuid }
                  sequenceNumber: { type: integer }
                  status: { type: string, enum: [queued, processing, observed, rejected] }
                  stateVersion: { type: integer }
                  createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/task-runs/{taskRunId}/inference-windows/{windowId}:
    parameters:
      - $ref: '#/components/parameters/TaskRunId'
      - { name: windowId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInferenceWindow
      summary: Read a queued inference window and its eventual result
      description: Requires a Cognito access token and an owned task run and window.
      responses:
        '200':
          description: Status, with an observation when observed or a safe error code when rejected.
          headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InferenceWindow' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cognitoAccessToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TaskPlanId: { in: path, name: taskPlanId, required: true, schema: { type: string, format: uuid } }
    TaskRunId: { in: path, name: taskRunId, required: true, schema: { type: string, format: uuid } }
    ImagePairingToken:
      in: query
      name: pairingToken
      description: Legacy pairing scope. Mutually exclusive with taskRunId.
      schema: { $ref: '#/components/schemas/PairingToken' }
    ImageTaskRunId:
      in: query
      name: taskRunId
      description: Run scope. Mutually exclusive with pairingToken.
      schema: { type: string, format: uuid }
  headers:
    RequestId:
      description: Correlation ID for server logs.
      schema: { type: string, format: uuid }
  responses:
    Run:
      description: Full current task run returned by start and read operations.
      headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/TaskRun' } } }
    RunCommand:
      description: Result of applying a command or stopping a run.
      headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/TaskRunCommandResult' } } }
    CreatedPlan:
      description: Generated draft persisted.
      headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/TaskPlan' } } }
    Plan:
      description: Current plan and any stored review.
      headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/TaskPlan' } } }
    Error:
      description: |
        Use error.code for handling, detail for display, and request_id for support. Examples
        include task_plan_invalid, task_plan_idempotency_conflict, task_plan_changed,
        task_plan_expired, task_run_idempotency_conflict, task_run_already_active,
        task_plan_stale, task_plan_not_draft, task_plan_not_refinable, task_plan_revision_limit,
        task_plan_guidelines_failed, plan_creation_invalid_response, plan_creation_unavailable,
        plan_refinement_invalid_response, plan_refinement_unavailable,
        plan_validation_invalid_response, plan_validation_unavailable,
        plan_approval_review_invalid_response, and plan_approval_review_unavailable.
        A 503 model failure may include safe model, upstream_status, failure_type, and
        suggested_action context. Do not assume every optional field is present.
      headers: { x-request-id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    PairingToken: { type: string, pattern: '^[0-9a-fA-F]{32}$' }
    ChatTranscript:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1 }
              imageIds: { type: array, items: { type: string, format: uuid } }
        provider: { $ref: '#/components/schemas/ExternalProvider' }
    ActiveRun:
      type: object
      required: [taskRunId, expectedStateVersion]
      properties:
        taskRunId: { type: string, format: uuid }
        expectedStateVersion: { type: integer, minimum: 1, maximum: 9000000000000000 }
    InferenceWindow:
      type: object
      required: [inferenceWindowId, sequenceNumber, status, stateVersion, createdAt]
      properties:
        inferenceWindowId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, processing, observed, rejected] }
        stateVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        lastCapturedAt: { type: string, format: date-time, description: Latest frame capture for checking the ten-second Talk observation reuse limit. }
        observation:
          type: object
          required: [summary, proposedTransition, confidence, evidenceFrameIndexes]
          properties:
            summary: { type: string, maxLength: 300 }
            proposedTransition: { type: string, enum: [remain_in_progress, candidate_complete, blocked] }
            confidence: { type: number, minimum: 0, maximum: 1 }
            evidenceFrameIndexes: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 2 } }
            answer: { type: string, maxLength: 500 }
        errorCode:
          type: string
          enum: [window_stale, window_worker_timeout, window_media_unavailable, window_inference_failed]
    RunRequest:
      type: object
      required: [clientRequestId, expectedStateVersion]
      properties:
        clientRequestId: { type: string, format: uuid }
        expectedStateVersion: { type: integer, minimum: 1, maximum: 9000000000000000 }
    TaskRun:
      type: object
      required: [taskRunId, taskPlanId, planVersion, status, currentStepOrdinal, stateVersion, latestSequenceNumber, lensInstruction, createdAt, updatedAt, stoppedAt]
      properties:
        taskRunId: { type: string, format: uuid }
        taskPlanId: { type: string, format: uuid }
        planVersion: { type: integer }
        status: { type: string, enum: [active, paused, stopped, completed] }
        currentStepOrdinal: { type: integer }
        currentStepStatus: { type: string, enum: [in_progress, confirmed, skipped] }
        stateVersion: { type: integer, minimum: 1 }
        latestSequenceNumber: { type: integer, minimum: 0 }
        lensInstruction: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time, nullable: true }
    TaskRunCommandResult:
      type: object
      required: [outcome, taskRunId, status, currentStepOrdinal, currentStepStatus, stateVersion, lensInstruction]
      properties:
        outcome: { type: string, enum: [applied] }
        taskRunId: { type: string, format: uuid }
        status: { type: string, enum: [active, paused, stopped, completed] }
        currentStepOrdinal: { type: integer, minimum: 1 }
        currentStepStatus: { type: string, enum: [in_progress, confirmed, skipped] }
        stateVersion: { type: integer, minimum: 1 }
        lensInstruction: { type: string }
    Error:
      type: object
      required: [detail, request_id, status, error]
      properties:
        detail: { type: string }
        request_id: { type: string, format: uuid }
        status: { type: integer }
        error:
          type: object
          required: [type, code, message]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            context: { type: object, additionalProperties: true }
    ExternalProvider:
      description: Optional per-request user supplied model provider credentials. The server validates provider-specific fields and does not persist them. Never store or log these values in the frontend.
      oneOf:
        - type: object
          required: [type, apiKey, model]
          properties:
            type: { type: string, enum: [openai, anthropic, google, nvidia, openrouter, groq, mistral, xai, together, fireworks, deepseek, perplexity, cerebras] }
            apiKey: { type: string, minLength: 1, maxLength: 8192 }
            model: { type: string, minLength: 1, maxLength: 300 }
          additionalProperties: false
        - type: object
          required: [type, apiKey, endpoint, model]
          properties:
            type: { type: string, enum: [azure] }
            apiKey: { type: string, minLength: 1, maxLength: 8192 }
            endpoint: { type: string, format: uri, maxLength: 2048, description: HTTPS endpoint under openai.azure.com, services.ai.azure.com, or models.ai.azure.com. Credentials and custom ports are not accepted. }
            model: { type: string, minLength: 1, maxLength: 300 }
          additionalProperties: false
        - type: object
          required: [type, accessKeyId, secretAccessKey, region, model]
          properties:
            type: { type: string, enum: [aws-bedrock] }
            accessKeyId: { type: string, minLength: 1, maxLength: 256 }
            secretAccessKey: { type: string, minLength: 1, maxLength: 8192 }
            sessionToken: { type: string, minLength: 1, maxLength: 8192 }
            region: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z]{2}(-gov)?-[a-z]+-[0-9]$' }
            model: { type: string, minLength: 1, maxLength: 300 }
          additionalProperties: false
    SourceStep:
      type: object
      required: [ordinal, instruction]
      description: Generated and refined steps include proposed checks. Older saved plans can omit them. Open questions block approval unless the review explicitly classifies their exact text as optional.
      properties:
        ordinal: { type: integer, minimum: 1 }
        instruction: { type: string }
        prechecks: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Conditions to check before the action. }
        postchecks: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Checks to perform after the action. }
        acceptanceCriteria: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Observable indications that the action succeeded. }
        safetyNotes: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Relevant suggested precautions. }
        openQuestions: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Proposed missing information. Blocks approval unless the review identifies the same question as optional. }
        optionalQuestions: { type: array, maxItems: 3, items: { type: string, maxLength: 240 }, description: Nonessential choices that can remain unanswered or be considered during the task. }
    TaskPlanSummary:
      type: object
      required: [taskPlanId, title, status, isOwner, currentVersion, approvedVersion, createdAt, updatedAt, expiresAt]
      properties:
        taskPlanId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, awaiting_approval, approved, abandoned] }
        isOwner: { type: boolean, description: Whether the caller created this plan. }
        currentVersion: { type: integer, minimum: 1 }
        approvedVersion: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true, description: Two hours after creation until approved; null for approved plans. }
    TaskPlanPage:
      type: object
      required: [items, nextOffset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaskPlanSummary' } }
        nextOffset: { type: integer, nullable: true }
    TaskPlan:
      type: object
      required: [taskPlanId, title, status, currentVersion, approvedVersion, createdAt, updatedAt, expiresAt, sourceSteps, validationStatus, validation, revisionHistory]
      properties:
        taskPlanId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, awaiting_approval, approved, abandoned] }
        currentVersion: { type: integer, minimum: 1 }
        approvedVersion: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        sourceSteps: { type: array, items: { $ref: '#/components/schemas/SourceStep' } }
        validationStatus: { type: string, enum: [not_validated, validated, needs_clarification] }
        validation:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PlanReview' }]
        revisionHistory:
          type: array
          items:
            type: object
            required: [clientRequestId, request, summary, version]
            properties:
              clientRequestId: { type: string, format: uuid }
              request: { type: string }
              summary: { type: string }
              version: { type: integer }
    PlanReview:
      type: object
      required: [planSummary, needsUserClarification, clarificationQuestions, steps, planRisks, unsupportedClaims, guidelineChecks, approvalBlockers, approvalReady]
      properties:
        planSummary: { type: string }
        needsUserClarification: { type: boolean }
        clarificationQuestions: { type: array, items: { type: string } }
        optionalQuestions: { type: array, maxItems: 20, items: { type: string, maxLength: 300 }, description: Nonblocking questions from the review. Older saved reviews can omit this field. }
        steps:
          type: array
          items:
            type: object
            required: [sourceStepOrdinal, canonicalInstruction, visualAcceptanceCriteria, riskLevel, requiresUserConfirmation, allowedTransitions]
            properties:
              sourceStepOrdinal: { type: integer }
              canonicalInstruction: { type: string }
              visualAcceptanceCriteria: { type: array, items: { type: string } }
              riskLevel: { type: string, enum: [low, medium, high] }
              requiresUserConfirmation: { type: boolean }
              allowedTransitions: { type: array, items: { type: string, enum: [remain_in_progress, candidate_complete, blocked] } }
        planRisks: { type: array, items: { type: string } }
        unsupportedClaims: { type: array, items: { type: string } }
        guidelineChecks:
          type: object
          required: [clarity, completeness, observability, safety]
          properties:
            clarity: { type: boolean }
            completeness: { type: boolean }
            observability: { type: boolean }
            safety: { type: boolean }
        approvalBlockers: { type: array, items: { type: string } }
        approvalReady: { type: boolean }
