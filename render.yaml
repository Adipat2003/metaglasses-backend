services:
  - type: web
    name: metaglasses-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: trial
      - key: AUTH_MODE
        value: required
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: PAIRING_TTL_SECONDS
        value: "3600"
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
