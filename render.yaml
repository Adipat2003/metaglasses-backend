services:
  - type: web
    name: metaglasses-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: trial
      - key: AUTH_MODE
        value: required
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: NVIDIA_MODEL
        value: moonshotai/kimi-k3
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: PAIRING_TTL_SECONDS
        value: "3600"
      - key: PAIRING_IMAGE_BUCKET
        value: Images
      - key: MAX_IMAGES_PER_PAIRING
        value: "10"
      - key: MAX_IMAGE_BYTES
        value: "8388608"
      - key: IMAGE_SIGNED_URL_TTL_SECONDS
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

  - type: web
    name: metaglasses-backend-prod
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: prod
      - key: AUTH_MODE
        value: required
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: NVIDIA_MODEL
        value: moonshotai/kimi-k3
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: PAIRING_TTL_SECONDS
        value: "3600"
      - key: PAIRING_IMAGE_BUCKET
        value: images
      - key: MAX_IMAGES_PER_PAIRING
        value: "10"
      - key: MAX_IMAGE_BYTES
        value: "8388608"
      - key: IMAGE_SIGNED_URL_TTL_SECONDS
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
