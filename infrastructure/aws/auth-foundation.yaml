AWSTemplateFormatVersion: "2010-09-09"
Description: "MetaGlasses authentication foundation: preserves SRP while adding public OAuth PKCE clients."

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: one Cognito user pool, legacy SRP client, and separate OAuth clients
    must:
      - Mobile clients must never receive an app client secret.
      - OAuth clients must use the code grant with exact registered redirect URIs.
      - Supabase users stay unchanged until a migration strategy is approved.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Replaces Supabase Auth with a managed OIDC issuer for the mobile app.
        must:
          - Email verification is required before the account can be trusted.
          - Deletion protection must remain active.
        mutable: change-with-constraints
        mutability:
          UsernameAttributes: must-never-change
          Schema: review-required
    Properties:
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AutoVerifiedAttributes:
        - email
      DeletionProtection: ACTIVE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      MfaConfiguration: OPTIONAL
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UsernameAttributes:
        - email
      UserPoolAddOns:
        AdvancedSecurityMode: AUDIT
      UserPoolTags:
        Project: metaglasses

  MobileAppClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Native mobile client uses SRP and rotating refresh tokens without a secret.
        must:
          - GenerateSecret must remain false.
          - ALLOW_REFRESH_TOKEN_AUTH must stay absent while refresh rotation is enabled.
        mutable: change-with-constraints
        mutability:
          GenerateSecret: must-never-change
          RefreshTokenRotation: review-required
    Properties:
      AccessTokenValidity: 15
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 30
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
      UserPoolId: !Ref UserPool

  OAuthUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Metadata:
      com.aws.cloudformation.Context:
        why: Enables the Cognito hosted UI OAuth endpoints without buying a custom domain.
        must:
          - Keep the account-scoped prefix to avoid cross-account naming conflicts.
          - Do not change the domain without updating every registered OAuth endpoint.
        mutable: review-required
        mutability:
          Domain: must-never-change
    Properties:
      Domain: !Sub "metaglasses-${AWS::AccountId}"
      ManagedLoginVersion: 1
      UserPoolId: !Ref UserPool

  OAuthMobileAppClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Gives Glanss browser sign-in with PKCE while preserving the shipped SRP client.
        must:
          - GenerateSecret must remain false for this public native client.
          - Allow only code grant and the exact glanss mobile callback.
          - ALLOW_REFRESH_TOKEN_AUTH must stay absent while refresh rotation is enabled.
        mutable: change-with-constraints
        mutability:
          CallbackURLs: review-required
          LogoutURLs: review-required
          GenerateSecret: must-never-change
          RefreshTokenRotation: review-required
    Properties:
      AccessTokenValidity: 15
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "glanss://auth/callback"
      EnableTokenRevocation: true
      GenerateSecret: false
      LogoutURLs:
        - "glanss://auth/callback"
      PreventUserExistenceErrors: ENABLED
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 30
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
      UserPoolId: !Ref UserPool

  PostmanOAuthAppClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Isolates Postman's browser PKCE testing callback from the mobile app client.
        must:
          - GenerateSecret must remain false for this public test client.
          - Allow only code grant and Postman's exact browser callback.
          - ALLOW_REFRESH_TOKEN_AUTH must stay absent while refresh rotation is enabled.
        mutable: change-with-constraints
        mutability:
          CallbackURLs: review-required
          LogoutURLs: review-required
          GenerateSecret: must-never-change
          RefreshTokenRotation: review-required
    Properties:
      AccessTokenValidity: 15
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "https://oauth.pstmn.io/v1/callback"
      EnableTokenRevocation: true
      GenerateSecret: false
      LogoutURLs:
        - "https://oauth.pstmn.io/v1/callback"
      PreventUserExistenceErrors: ENABLED
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 30
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Description: Cognito user pool ID for the API and mobile application.
    Value: !Ref UserPool
  MobileAppClientId:
    Description: Public Cognito app client ID for the mobile application.
    Value: !Ref MobileAppClient
  OAuthMobileAppClientId:
    Description: Public OAuth PKCE app client ID for Glanss.
    Value: !Ref OAuthMobileAppClient
  PostmanOAuthAppClientId:
    Description: Public OAuth PKCE app client ID for Postman testing.
    Value: !Ref PostmanOAuthAppClient
  CognitoHostedUiBaseUrl:
    Description: Cognito hosted UI base URL for OAuth authorize and token endpoints.
    Value: !Sub "https://metaglasses-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  JwtIssuer:
    Description: JWT issuer that the API will validate.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
