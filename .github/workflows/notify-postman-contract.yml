name: Notify Postman contract sync

on:
  workflow_call:
    inputs:
      backend_sha:
        required: true
        type: string
      source_run_url:
        required: true
        type: string
    secrets:
      postman_sync_app_private_key:
        required: true

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check GitHub App configuration
        env:
          POSTMAN_SYNC_APP_ID: ${{ vars.POSTMAN_SYNC_APP_ID }}
          POSTMAN_SYNC_APP_PRIVATE_KEY: ${{ secrets.postman_sync_app_private_key }}
        run: |
          if [[ -z "$POSTMAN_SYNC_APP_ID" || -z "$POSTMAN_SYNC_APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure POSTMAN_SYNC_APP_ID and POSTMAN_SYNC_APP_PRIVATE_KEY for Postman sync."
            exit 1
          fi

      - name: Create short-lived Postman GitHub App token
        id: postman-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.POSTMAN_SYNC_APP_ID }}
          private-key: ${{ secrets.postman_sync_app_private_key }}
          owner: Adipat2003
          repositories: metaglasses-postman
          permission-contents: write

      - name: Dispatch canonical Postman sync
        env:
          DISPATCH_TOKEN: ${{ steps.postman-app-token.outputs.token }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          SOURCE_RUN_URL: ${{ inputs.source_run_url }}
          DEPLOYMENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc \
            --arg sha "$BACKEND_SHA" --arg ci "$SOURCE_RUN_URL" --arg deploy "$DEPLOYMENT_RUN_URL" \
            '{event_type:"backend-contract-changed", client_payload:{
              backend_repository:"Adipat2003/metaglasses-backend",
              backend_sha:$sha, source_run_url:$ci, deployment_run_url:$deploy
            }}')
          curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Adipat2003/metaglasses-postman/dispatches \
            --data "$payload"
