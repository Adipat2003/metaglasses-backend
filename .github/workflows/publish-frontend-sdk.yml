name: Publish frontend SDK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-sdk-publish-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.16.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install locked SDK tooling
        run: npm ci --prefix frontend-sdk

      - name: Regenerate and validate SDK
        run: |
          npm run generate --prefix frontend-sdk
          git diff --exit-code -- frontend-sdk/api-types.d.ts
          npm test --prefix frontend-sdk
          node scripts/check-frontend-sdk-package.mjs

      - name: Set unique main build version
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          VERSION=$(node -e '
            const [major, minor, patch] = require("./frontend-sdk/package.json").version.split(".");
            if (![major, minor, patch].every((part) => /^\d+$/.test(part))) {
              throw new Error("frontend-sdk/package.json must use a stable major.minor.patch version");
            }
            console.log(`${major}.${minor}.${process.env.CI_RUN_NUMBER}-main.${process.env.CI_RUN_ATTEMPT}`);
          ')
          npm version "$VERSION" --no-git-tag-version --prefix frontend-sdk

      - name: Publish public package with provenance
        working-directory: frontend-sdk
        run: npm publish --access public --provenance --tag latest
