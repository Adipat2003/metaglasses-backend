name: Publish frontend SDK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-sdk-main-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.ref == 'refs/heads/main' &&
      github.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.16.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install locked SDK tooling
        run: npm ci --prefix frontend-sdk

      - name: Regenerate and validate SDK
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run generate --prefix frontend-sdk
          git diff --exit-code -- frontend-sdk/api-types.d.ts
          npm test --prefix frontend-sdk

      - name: Set unique main build version
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        id: sdk_version
        run: |
          VERSION=$(node -e '
            const version = require("./frontend-sdk/package.json").version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error("frontend-sdk/package.json must use a stable major.minor.patch version");
            }
            const [major, minor] = version.split(".");
            console.log(`${major}.${minor}.${process.env.CI_RUN_NUMBER}`);
          ')
          npm version "$VERSION" --allow-same-version --no-git-tag-version --prefix frontend-sdk
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check final SDK package contents
        run: node scripts/check-frontend-sdk-package.mjs

      - name: Check whether this version advances npm latest
        id: release
        env:
          VERSION: ${{ steps.sdk_version.outputs.value }}
        run: |
          latest=$(npm view metaglasses-sdk@latest version --json --prefer-online --fetch-retries=0 --fetch-timeout=10000)
          LATEST="$latest" node -e '
            const parse = (version) => {
              if (typeof version !== "string" ||
                !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
                throw new Error("Expected a stable SDK version");
              }
              return version.split(".").map(BigInt);
            };
            const version = parse(process.env.VERSION);
            const current = parse(JSON.parse(process.env.LATEST));
            const difference = version.findIndex((part, index) => part !== current[index]);
            console.log(`publish=${difference >= 0 && version[difference] > current[difference]}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Publish public package with provenance
        if: steps.release.outputs.publish == 'true'
        working-directory: frontend-sdk
        run: npm publish --access public --provenance --tag latest
