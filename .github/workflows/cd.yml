name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-trial:
    name: Deploy trial
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-trial
      cancel-in-progress: true
    environment:
      name: trial
      url: https://uitdzmwfqtsohgffhuom.supabase.co/functions/v1/api
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: uitdzmwfqtsohgffhuom

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Prepare local CLI configuration
        run: cp supabase/signing_keys.example.json supabase/signing_keys.json

      - name: Apply trial migrations
        run: |
          npx --yes supabase@2.116.0 link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@2.116.0 db push --linked --include-all --yes

      - name: Deploy trial functions
        run: npx --yes supabase@2.116.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify trial health
        run: |
          for trial_attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-production:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hxtdfghufjjmeltarffl.supabase.co/functions/v1/api
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: hxtdfghufjjmeltarffl

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm CI passed for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_runs=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          test "$ci_runs" -gt 0

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Prepare local CLI configuration
        run: cp supabase/signing_keys.example.json supabase/signing_keys.json

      - name: Apply production migrations
        run: |
          npx --yes supabase@2.116.0 link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@2.116.0 db push --linked --include-all --yes

      - name: Deploy production functions
        run: npx --yes supabase@2.116.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify production health
        run: |
          for production_attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
