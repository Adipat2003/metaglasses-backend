name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-container:
    name: Publish container
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/adipat2003/metaglasses-backend:latest
            ghcr.io/adipat2003/metaglasses-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-trial:
    name: Deploy trial
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-trial
      cancel-in-progress: true
    environment:
      name: trial
      url: https://metaglasses-backend.onrender.com

    steps:
      - name: Trigger Render trial deploy
        env:
          GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_TRIAL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          curl --fail-with-body --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GIT_COMMIT_SHA}"

  deploy-production:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://metaglasses-backend-prod.onrender.com

    steps:
      - name: Confirm CI passed for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_runs=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          test "$ci_runs" -gt 0

      - name: Trigger Render production deploy
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          curl --fail-with-body --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GIT_COMMIT_SHA}"
